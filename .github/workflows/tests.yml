name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell   # Windows PowerShell 5.1, what end users run
          - os: windows-latest
            shell: pwsh
          - os: ubuntu-latest
            shell: pwsh
    # Step-level 'shell' can't use expressions; job-level defaults can.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: ./tests/Run-Tests.ps1

  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error)
          $issues | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($issues.Count -gt 0) { exit 1 }

  integration:
    name: Apply + undo on a real Windows runner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply every tweak, undo, compare
        shell: powershell
        run: ./tests/Integration.ps1

  gui:
    name: GUI smoke test (real window, screenshots)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Open the window and drive it
        shell: powershell
        env:
          DEBLOATIFY_PRINT_SCREENSHOTS: '1'
        run: ./tests/GuiSmoke.ps1
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: gui-screenshots/
          if-no-files-found: ignore
